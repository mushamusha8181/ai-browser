name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply source build fixes
        shell: bash
        run: |
          sed -i 's/import android.app.PrintManager/import android.print.PrintManager/' app/src/main/java/jp/mushamusha/aibrowser/MainActivity.kt
          sed -i 's/continuation.resumeWith(Result.failure(e))/continuation.resumeWith(kotlin.Result.failure(e))/' app/src/main/java/jp/mushamusha/aibrowser/WatchWorker.kt
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/jp/mushamusha/aibrowser/MainActivity.kt app/src/main/java/jp/mushamusha/aibrowser/WatchWorker.kt
            git commit -m "Fix Android source compile errors"
            git push origin HEAD:main
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AIブラウザ-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
